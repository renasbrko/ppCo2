<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auth Security Test | PPAlend</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; line-height: 1.6; }
    .test-section { margin: 2rem 0; padding: 1rem; border: 1px solid #ccc; border-radius: 8px; }
    .result { margin: 1rem 0; padding: 0.5rem; border-radius: 4px; }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
    .info { background: #d1ecf1; color: #0c5460; }
    .warning { background: #fff3cd; color: #856404; }
    button { padding: 0.5rem 1rem; margin: 0.5rem; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:disabled { background: #6c757d; cursor: not-allowed; }
    input { padding: 0.5rem; margin: 0.5rem; border: 1px solid #ccc; border-radius: 4px; }
    .status { font-weight: bold; margin: 0.5rem 0; }
  </style>
</head>
<body>
  <h1>Authentication Security Test Suite</h1>
  
  <div class="test-section">
    <h2>1. Configuration Test</h2>
    <button onclick="testConfig()">Test Supabase Config</button>
    <div id="configResult"></div>
  </div>

  <div class="test-section">
    <h2>2. Admin Login Test</h2>
    <input type="email" id="adminEmail" placeholder="renasbrko1@gmail.com" style="width: 300px;">
    <input type="password" id="adminPassword" placeholder="password" style="width: 200px;">
    <button onclick="testAdminLogin()">Test Admin Login</button>
    <div id="adminLoginResult"></div>
  </div>

  <div class="test-section">
    <h2>3. Brute Force Protection Test</h2>
    <button onclick="testBruteForce()">Test 5 Failed Attempts</button>
    <button onclick="testLockout()">Test Lockout Status</button>
    <div id="bruteForceResult"></div>
  </div>

  <div class="test-section">
    <h2>4. Session Persistence Test</h2>
    <button onclick="testSessionPersistence()">Test Session Restore</button>
    <button onclick="testLogout()">Test Logout</button>
    <div id="sessionResult"></div>
  </div>

  <div class="test-section">
    <h2>5. Unauthorized Access Test</h2>
    <button onclick="testUnauthorizedAccess()">Test Non-Admin Access</button>
    <div id="unauthorizedResult"></div>
  </div>

  <div class="test-section">
    <h2>6. Auto-Admin Assignment Test</h2>
    <button onclick="testAutoAdmin()">Test Auto-Admin for renasbrko1@gmail.com</button>
    <div id="autoAdminResult"></div>
  </div>

  <script src="js/env.js"></script>
  <script src="js/supabase-auth.js"></script>
  <script>
    function showResult(elementId, message, type = 'info') {
      const el = document.getElementById(elementId);
      el.innerHTML = `<div class="result ${type}">${message}</div>`;
    }

    async function testConfig() {
      try {
        await window.AlendAuth.init();
        const cfg = window.ALEND_SUPABASE_CONFIG;
        const hasUrl = cfg?.url && cfg.url.startsWith('https://');
        const hasKey = cfg?.anonKey && cfg.anonKey.length > 30;
        const hasProjectId = cfg?.url?.includes('wezuhzjatooyimnpibmv');
        
        showResult('configResult', 
          `✅ Config: ${hasUrl ? 'URL' : '❌ URL'}, ${hasKey ? 'Key' : '❌ Key'}, ${hasProjectId ? 'Project ID' : '❌ Project ID'}`, 
          hasUrl && hasKey && hasProjectId ? 'success' : 'error'
        );
      } catch (error) {
        showResult('configResult', `❌ Config error: ${error.message}`, 'error');
      }
    }

    async function testAdminLogin() {
      const email = document.getElementById('adminEmail').value;
      const password = document.getElementById('adminPassword').value;
      
      if (!email || !password) {
        showResult('adminLoginResult', '❌ Please enter email and password', 'error');
        return;
      }

      try {
        showResult('adminLoginResult', '🔄 Testing admin login...', 'info');
        const result = await window.AlendAuth.signInWithEmailPassword(email, password, {
          securityContext: "admin"
        });
        
        const session = await window.AlendAuth.getSession();
        const isAdmin = await window.AlendAuth.isUserAdmin(session.user);
        
        if (isAdmin && email === 'renasbrko1@gmail.com') {
          showResult('adminLoginResult', '✅ Admin login successful! Auto-admin assignment working.', 'success');
        } else if (isAdmin) {
          showResult('adminLoginResult', '✅ Admin login successful!', 'success');
        } else {
          showResult('adminLoginResult', '❌ Login successful but not admin', 'warning');
        }
      } catch (error) {
        showResult('adminLoginResult', `❌ Admin login failed: ${error.message}`, 'error');
      }
    }

    async function testBruteForce() {
      const email = 'test@example.com';
      const password = 'wrongpassword';
      let attempts = 0;
      let lockoutTriggered = false;

      showResult('bruteForceResult', '🔄 Testing brute force protection...', 'info');

      for (let i = 0; i < 6; i++) {
        try {
          await window.AlendAuth.signInWithEmailPassword(email, password, {
            securityContext: "admin"
          });
          showResult('bruteForceResult', '❌ Brute force protection failed - login succeeded with wrong password', 'error');
          return;
        } catch (error) {
          attempts++;
          if (error.message.includes('قفڵ') || error.message.includes('lockout') || error.message.includes('حظر')) {
            lockoutTriggered = true;
            break;
          }
        }
      }

      if (lockoutTriggered) {
        showResult('bruteForceResult', '✅ Brute force protection working - lockout triggered after 5 attempts', 'success');
      } else {
        showResult('bruteForceResult', '⚠️ Brute force test completed - check if lockout message appears', 'warning');
      }
    }

    async function testLockout() {
      try {
        await window.AlendAuth.signInWithEmailPassword('test@example.com', 'wrongpassword', {
          securityContext: "admin"
        });
        showResult('bruteForceResult', '❌ No lockout detected', 'error');
      } catch (error) {
        if (error.message.includes('قفڵ') || error.message.includes('lockout') || error.message.includes('حظر')) {
          showResult('bruteForceResult', '✅ Account lockout is active', 'success');
        } else {
          showResult('bruteForceResult', `ℹ️ Lockout status: ${error.message}`, 'info');
        }
      }
    }

    async function testSessionPersistence() {
      try {
        const session = await window.AlendAuth.getSession();
        if (session?.user) {
          const isAdmin = await window.AlendAuth.isUserAdmin(session.user);
          showResult('sessionResult', 
            `✅ Session persistent - User: ${session.user.email}, Admin: ${isAdmin}`, 
            'success'
          );
        } else {
          showResult('sessionResult', 'ℹ️ No active session - login first', 'info');
        }
      } catch (error) {
        showResult('sessionResult', `❌ Session test failed: ${error.message}`, 'error');
      }
    }

    async function testLogout() {
      try {
        await window.AlendAuth.signOutLocal();
        const session = await window.AlendAuth.getSession();
        if (!session?.user) {
          showResult('sessionResult', '✅ Logout successful - session cleared', 'success');
        } else {
          showResult('sessionResult', '❌ Logout failed - session still active', 'error');
        }
      } catch (error) {
        showResult('sessionResult', `❌ Logout test failed: ${error.message}`, 'error');
      }
    }

    async function testUnauthorizedAccess() {
      try {
        // Create a fake user object
        const fakeUser = { id: 'fake-id', email: 'fake@example.com' };
        const isAdmin = await window.AlendAuth.isUserAdmin(fakeUser);
        
        if (isAdmin) {
          showResult('unauthorizedResult', '❌ SECURITY BREACH: Fake user detected as admin!', 'error');
        } else {
          showResult('unauthorizedResult', '✅ Unauthorized access properly blocked', 'success');
        }
      } catch (error) {
        showResult('unauthorizedResult', `ℹ️ Unauthorized access test: ${error.message}`, 'info');
      }
    }

    async function testAutoAdmin() {
      try {
        // Simulate user login for renasbrko1@gmail.com
        const fakeUser = { 
          id: 'test-user-id', 
          email: 'renasbrko1@gmail.com',
          user_metadata: { full_name: 'Test Admin' }
        };
        
        // This should trigger auto-admin assignment
        await window.AlendAuth.syncPublicUserRow(fakeUser);
        
        // Check if user is now admin
        const isAdmin = await window.AlendAuth.isUserAdmin(fakeUser);
        
        if (isAdmin) {
          showResult('autoAdminResult', '✅ Auto-admin assignment working for renasbrko1@gmail.com', 'success');
        } else {
          showResult('autoAdminResult', '❌ Auto-admin assignment not working', 'error');
        }
      } catch (error) {
        showResult('autoAdminResult', `❌ Auto-admin test failed: ${error.message}`, 'error');
      }
    }

    // Auto-run config test on load
    window.addEventListener('load', testConfig);
  </script>
</body>
</html>
