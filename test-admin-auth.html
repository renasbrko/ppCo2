<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Auth Test | PPAlend</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; line-height: 1.6; }
    .test-section { margin: 2rem 0; padding: 1rem; border: 1px solid #ccc; border-radius: 8px; }
    .result { margin: 1rem 0; padding: 0.5rem; border-radius: 4px; }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
    .info { background: #d1ecf1; color: #0c5460; }
    button { padding: 0.5rem 1rem; margin: 0.5rem; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:disabled { background: #6c757d; cursor: not-allowed; }
  </style>
</head>
<body>
  <h1>Admin Authentication Test</h1>
  
  <div class="test-section">
    <h2>1. Configuration Test</h2>
    <button onclick="testConfig()">Test Configuration</button>
    <div id="configResult"></div>
  </div>

  <div class="test-section">
    <h2>2. Authentication Test</h2>
    <input type="email" id="testEmail" placeholder="admin@example.com" style="margin: 0.5rem; padding: 0.5rem;">
    <input type="password" id="testPassword" placeholder="password" style="margin: 0.5rem; padding: 0.5rem;">
    <button onclick="testAuth()">Test Login</button>
    <div id="authResult"></div>
  </div>

  <div class="test-section">
    <h2>3. Admin Check Test</h2>
    <button onclick="testAdminCheck()">Check Admin Status</button>
    <div id="adminResult"></div>
  </div>

  <div class="test-section">
    <h2>4. Security Test</h2>
    <button onclick="testSecurity()">Test Security Bypasses</button>
    <div id="securityResult"></div>
  </div>

  <script src="js/env.js"></script>
  <script src="js/supabase-auth.js"></script>
  <script>
    function showResult(elementId, message, type = 'info') {
      const el = document.getElementById(elementId);
      el.innerHTML = `<div class="result ${type}">${message}</div>`;
    }

    async function testConfig() {
      try {
        await window.AlendAuth.init();
        const cfg = window.ALEND_SUPABASE_CONFIG;
        showResult('configResult', 
          `Config loaded: ${cfg?.url ? '✅ URL' : '❌ No URL'}, ${cfg?.anonKey ? '✅ Anon Key' : '❌ No Anon Key'}`, 
          cfg?.url && cfg?.anonKey ? 'success' : 'error'
        );
      } catch (error) {
        showResult('configResult', `Config error: ${error.message}`, 'error');
      }
    }

    async function testAuth() {
      const email = document.getElementById('testEmail').value;
      const password = document.getElementById('testPassword').value;
      
      if (!email || !password) {
        showResult('authResult', 'Please enter email and password', 'error');
        return;
      }

      try {
        showResult('authResult', 'Attempting login...', 'info');
        const result = await window.AlendAuth.signInWithEmailPassword(email, password);
        showResult('authResult', `✅ Login successful! User: ${result.user?.email}`, 'success');
      } catch (error) {
        showResult('authResult', `❌ Login failed: ${error.message}`, 'error');
      }
    }

    async function testAdminCheck() {
      try {
        const user = await window.AlendAuth.getUser();
        if (!user) {
          showResult('adminResult', '❌ No user logged in', 'error');
          return;
        }

        const isAdmin = await window.AlendAuth.isUserAdmin(user);
        showResult('adminResult', 
          `User: ${user.email}, Admin: ${isAdmin ? '✅ Yes' : '❌ No'}`, 
          isAdmin ? 'success' : 'info'
        );
      } catch (error) {
        showResult('adminResult', `❌ Admin check failed: ${error.message}`, 'error');
      }
    }

    async function testSecurity() {
      const results = [];
      
      // Test 1: Check if hardcoded email bypass exists
      const originalGetConfig = window.AlendAuth.init;
      let bypassFound = false;
      
      try {
        // Try to access admin config
        const cfg = window.ALEND_SUPABASE_CONFIG;
        if (cfg?.adminEmail) {
          bypassFound = true;
          results.push('❌ Hardcoded admin email found in config');
        } else {
          results.push('✅ No hardcoded admin email in config');
        }
      } catch (e) {
        results.push('✅ Config access properly restricted');
      }

      // Test 2: Check if isUserAdmin relies only on database
      const user = await window.AlendAuth.getUser();
      if (user) {
        // Test with fake admin email
        const originalUser = { ...user, email: 'fake-admin@test.com' };
        const isAdmin = await window.AlendAuth.isUserAdmin(originalUser);
        if (!isAdmin) {
          results.push('✅ Email-based admin bypass properly blocked');
        } else {
          results.push('❌ Email-based admin bypass detected');
        }
      } else {
        results.push('ℹ️ No user logged in - skipping bypass test');
      }

      showResult('securityResult', results.join('<br>'), bypassFound ? 'error' : 'success');
    }

    // Auto-run config test on load
    window.addEventListener('load', testConfig);
  </script>
</body>
</html>
