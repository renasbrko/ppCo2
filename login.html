<!DOCTYPE html>
<html lang="ku" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>چوونەژوورەوە | PPAlend</title>
  <link rel="icon" href="logo.png" type="image/png">
  <style>
    :root {
      --bg: #081327;
      --bg-soft: #0b1b34;
      --card: #0f223f;
      --border: rgba(255, 255, 255, 0.1);
      --gold: #c9a24d;
      --gold-light: #e0ba6d;
      --text: #e8f0fb;
      --muted: #8fa8c5;
      --danger: #ff8a8a;
      --radius-lg: 20px;
      --radius-md: 12px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Cairo", "Noto Naskh Arabic", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.25rem;
      overflow-x: hidden;
      direction: rtl;
      text-align: right;
      position: relative;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 20% 20%, rgba(201, 162, 77, 0.12), transparent 45%),
        radial-gradient(circle at 80% 80%, rgba(24, 63, 115, 0.45), transparent 42%),
        linear-gradient(150deg, var(--bg), var(--bg-soft));
      z-index: -1;
    }
    .card {
      width: 100%;
      max-width: 430px;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: linear-gradient(180deg, rgba(15, 34, 63, 0.96), rgba(10, 24, 44, 0.96));
      padding: 1.7rem;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(4px);
    }
    .logo-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 0.75rem;
    }
    .logo {
      width: 64px;
      height: 64px;
      border-radius: 14px;
      box-shadow: 0 8px 22px rgba(201, 162, 77, 0.25);
    }
    h1 {
      margin: 0.3rem 0 0.35rem;
      font-size: 1.45rem;
      text-align: center;
      line-height: 1.35;
      color: #ffffff;
    }
    p {
      margin: 0 0 1.3rem;
      color: var(--muted);
      font-size: 0.96rem;
      text-align: center;
      line-height: 1.7;
    }
    .actions {
      display: grid;
      gap: 0.72rem;
    }
    .btn {
      width: 100%;
      border: 1px solid transparent;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      color: #12233f;
      padding: 0.82rem 1rem;
      cursor: pointer;
      margin: 0;
      font-weight: 700;
      font-size: 0.95rem;
      transition: transform 0.22s ease, box-shadow 0.22s ease, filter 0.22s ease;
      box-shadow: 0 10px 22px rgba(201, 162, 77, 0.24);
    }
    .btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.03);
      box-shadow: 0 14px 28px rgba(201, 162, 77, 0.32);
    }
    .btn:active {
      transform: translateY(0);
    }
    .hint {
      font-size: 0.82rem;
      color: var(--muted);
      margin-top: 1rem;
      text-align: center;
      line-height: 1.65;
    }
    .error {
      color: var(--danger);
      font-size: 0.85rem;
      min-height: 1.2rem;
      margin-top: 0.8rem;
      text-align: center;
      line-height: 1.5;
    }

    @media (max-width: 480px) {
      .card {
        border-radius: 16px;
        padding: 1.15rem 1rem;
      }
      h1 {
        font-size: 1.25rem;
      }
      p {
        font-size: 0.9rem;
        margin-bottom: 1rem;
      }
      .btn {
        padding: 0.74rem 0.85rem;
        font-size: 0.92rem;
      }
      .logo {
        width: 56px;
        height: 56px;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo-wrap">
      <img src="logo.png" alt="PPAlend logo" class="logo">
    </div>
    <h1>چوونەژوورەوەی پارێزراو</h1>
    <p>بۆ گەیشتن بە ناوەڕۆکی پەروەردەیی، تکایە بە گووگڵ یان ئەپڵ بچۆرە ژوورەوە.</p>

    <div class="actions">
      <button class="btn" id="googleBtn">چوونەژوورەوە بە Google</button>
      <button class="btn" id="appleBtn">چوونەژوورەوە بە Apple</button>
    </div>
    <div class="error" id="authError"></div>
    <div class="hint">تەنها بەکارهێنەری ڕێپێدراو دەتوانێت ناوەڕۆکی پارێزراو ببینێت.</div>
  </main>

  <script src="js/env.js"></script>
  <script src="js/supabase-auth.js"></script>
  <script>
    const errorNode = document.getElementById("authError");

    async function bootLogin() {
      await window.AlendAuth.init();
      const session = await window.AlendAuth.getSession();
      if (session?.user) {
        window.location.href = "index.html";
      }
    }

    document.getElementById("googleBtn").addEventListener("click", async () => {
      errorNode.textContent = "";
      try {
        await window.AlendAuth.signInWithOAuth("google");
      } catch (error) {
        errorNode.textContent = error.message || "Google sign-in failed.";
      }
    });

    document.getElementById("appleBtn").addEventListener("click", async () => {
      errorNode.textContent = "";
      try {
        await window.AlendAuth.signInWithOAuth("apple");
      } catch (error) {
        errorNode.textContent = error.message || "Apple sign-in failed.";
      }
    });

    bootLogin();
  </script>
</body>
</html>
