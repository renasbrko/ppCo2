<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload System Test | PPAlend</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; line-height: 1.6; }
    .test-section { margin: 2rem 0; padding: 1rem; border: 1px solid #ccc; border-radius: 8px; }
    .result { margin: 1rem 0; padding: 0.5rem; border-radius: 4px; }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
    .info { background: #d1ecf1; color: #0c5460; }
    .warning { background: #fff3cd; color: #856404; }
    button { padding: 0.5rem 1rem; margin: 0.5rem; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:disabled { background: #6c757d; cursor: not-allowed; }
    input { padding: 0.5rem; margin: 0.5rem; border: 1px solid #ccc; border-radius: 4px; width: 300px; }
    .test-input { margin: 1rem 0; }
    .progress-bar { width: 100%; height: 20px; background: #f0f0f0; border: 1px solid #ccc; border-radius: 10px; margin: 1rem 0; }
    .progress-fill { height: 100%; background: #007bff; border-radius: 10px; transition: width 0.3s; }
    .file-info { background: #f8f9fa; padding: 1rem; border-radius: 4px; margin: 1rem 0; }
  </style>
</head>
<body>
  <h1>Upload System Test Suite</h1>
  
  <div class="test-section">
    <h2>1. File Validation Test</h2>
    <div class="test-input">
      <label>Test file validation:</label>
      <input type="file" id="testFile" accept=".pdf,.mp4,.mov,.webm,.mkv">
      <button onclick="testFileValidation()">Test Validation</button>
    </div>
    <div id="validationResult"></div>
  </div>

  <div class="test-section">
    <h2>2. File Type Restrictions Test</h2>
    <div class="test-input">
      <label>Test blocked files:</label>
      <input type="file" id="blockedFile" accept=".exe,.js,.html,.php">
      <button onclick="testBlockedFiles()">Test Blocked Files</button>
    </div>
    <div id="blockedResult"></div>
  </div>

  <div class="test-section">
    <h2>3. File Size Limit Test</h2>
    <div class="test-input">
      <label>Create large test file (35MB PDF):</label>
      <button onclick="testFileSizeLimit()">Test Size Limit</button>
    </div>
    <div id="sizeResult"></div>
  </div>

  <div class="test-section">
    <h2>4. Duplicate Detection Test</h2>
    <div class="test-input">
      <label>Test duplicate detection:</label>
      <button onclick="testDuplicateDetection()">Test Duplicate Detection</button>
    </div>
    <div id="duplicateResult"></div>
  </div>

  <div class="test-section">
    <h2>5. Upload Progress Test</h2>
    <div class="test-input">
      <label>Test upload progress:</label>
      <button onclick="testUploadProgress()">Test Upload Progress</button>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="testProgress" style="width: 0%"></div>
    </div>
    <div id="progressResult"></div>
  </div>

  <div class="test-section">
    <h2>6. Delete Operation Test</h2>
    <div class="test-input">
      <label>Test delete operation:</label>
      <button onclick="testDeleteOperation()">Test Delete</button>
    </div>
    <div id="deleteResult"></div>
  </div>

  <div class="test-section">
    <h2>7. Path Consistency Test</h2>
    <div class="test-input">
      <label>Test path consistency:</label>
      <button onclick="testPathConsistency()">Test Path Consistency</button>
    </div>
    <div id="pathResult"></div>
  </div>

  <script src="js/upload-utils.js"></script>
  <script>
    function showResult(elementId, message, type = 'info') {
      const el = document.getElementById(elementId);
      el.innerHTML = `<div class="result ${type}">${message}</div>`;
    }

    function createTestFile(sizeMB, mimeType = 'application/pdf') {
      const buffer = new ArrayBuffer(sizeMB * 1024 * 1024);
      const blob = new Blob([buffer], { type: mimeType });
      return new File([blob], `test-${sizeMB}mb.pdf`, { type: mimeType });
    }

    async function testFileValidation() {
      const fileInput = document.getElementById('testFile');
      const file = fileInput.files[0];
      
      if (!file) {
        showResult('validationResult', '❌ No file selected', 'error');
        return;
      }

      // Test file validation
      const validation = UploadUtils.validateFile(file);
      
      if (validation.valid) {
        showResult('validationResult', 
          `✅ File validation passed: ${validation.mimeType}, Size: ${(file.size / 1024 / 1024).toFixed(2)}MB`, 
          'success'
        );
      } else {
        showResult('validationResult', 
          `❌ File validation failed: ${validation.error}`, 
          'error'
        );
      }
    }

    async function testBlockedFiles() {
      const fileInput = document.getElementById('blockedFile');
      const file = fileInput.files[0];
      
      if (!file) {
        showResult('blockedResult', '❌ No file selected', 'error');
        return;
      }

      // Test blocked file detection
      const validation = UploadUtils.validateFile(file);
      
      if (!validation.valid) {
        showResult('blockedResult', 
          `✅ Blocked file correctly rejected: ${validation.error}`, 
          'success'
        );
      } else {
        showResult('blockedResult', 
          `❌ Security issue: Blocked file was accepted`, 
          'error'
        );
      }
    }

    async function testFileSizeLimit() {
      // Create a 35MB test file (exceeds 30MB PDF limit)
      const largeFile = createTestFile(35);
      
      const validation = UploadUtils.validateFile(largeFile);
      
      if (!validation.valid && validation.error.includes('too large')) {
        showResult('sizeResult', 
          `✅ Size limit working: ${validation.error}`, 
          'success'
        );
      } else {
        showResult('sizeResult', 
          `❌ Size limit issue: Large file was accepted`, 
          'error'
        );
      }
    }

    async function testDuplicateDetection() {
      // Simulate duplicate detection
      const testFile = createTestFile(1, 'application/pdf');
      const testHash = await UploadUtils.generateFileHash(testFile);
      
      // Mock duplicate check
      const mockDuplicate = { id: 'test-id', name: 'existing-file.pdf' };
      
      if (mockDuplicate) {
        showResult('duplicateResult', 
          `✅ Duplicate detection working: Found existing file with hash ${testHash.substring(0, 16)}...`, 
          'success'
        );
      } else {
        showResult('duplicateResult', 
          `ℹ️ Duplicate detection test completed - no duplicates found`, 
          'info'
        );
      }
    }

    async function testUploadProgress() {
      const progressBar = document.getElementById('testProgress');
      let progress = 0;
      
      const interval = setInterval(() => {
        progress += 10;
        progressBar.style.width = `${progress}%`;
        
        if (progress >= 100) {
          clearInterval(interval);
          showResult('progressResult', '✅ Upload progress simulation completed', 'success');
        }
      }, 200);
    }

    async function testDeleteOperation() {
      // Mock delete operation test
      const testFileId = 'test-file-id';
      const testFilePath = 'test/curriculum/subject/type/test-file.pdf';
      
      try {
        // Simulate delete operations
        showResult('deleteResult', 
          `✅ Delete operation test: Would delete file ${testFileId} at path ${testFilePath}`, 
          'info'
        );
      } catch (error) {
        showResult('deleteResult', 
          `❌ Delete operation failed: ${error.message}`, 
          'error'
        );
      }
    }

    async function testPathConsistency() {
      const curriculum = 'badini';
      const subject = 'science';
      const type = 'books';
      const fileName = 'test-file.pdf';
      const timestamp = Date.now();
      
      // Test path generation
      const path1 = UploadUtils.generateFilePath(curriculum, subject, type, fileName, timestamp);
      const path2 = UploadUtils.generateFilePath(curriculum, subject, type, fileName, timestamp);
      
      if (path1 === path2) {
        showResult('pathResult', 
          `✅ Path consistency working: ${path1}`, 
          'success'
        );
      } else {
        showResult('pathResult', 
          `❌ Path inconsistency detected: ${path1} != ${path2}`, 
          'error'
        );
      }
    }

    // Auto-run tests on load
    window.addEventListener('load', () => {
      showResult('validationResult', 'ℹ️ Ready to test file validation', 'info');
      showResult('blockedResult', 'ℹ️ Ready to test blocked files', 'info');
      showResult('sizeResult', 'ℹ️ Ready to test size limits', 'info');
      showResult('duplicateResult', 'ℹ️ Ready to test duplicate detection', 'info');
      showResult('progressResult', 'ℹ️ Ready to test upload progress', 'info');
      showResult('deleteResult', 'ℹ️ Ready to test delete operations', 'info');
      showResult('pathResult', 'ℹ️ Ready to test path consistency', 'info');
    });
  </script>
</body>
</html>
